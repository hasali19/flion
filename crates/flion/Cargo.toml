[package]
name = "flion"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitflags = "2.8.0"
byteorder = "1.5.0"
ctor = "1.0.13"
eyre = "0.6"
flutter-embedder = { path = "../flutter-embedder" }
gl = "0.14"
linkme = "0.3.32"
parking_lot = "0.12.3"
raw-window-handle = "0.6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol_str = "0.3.6"
tracing = "0.1"

[build-dependencies]
dunce = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
calloop = "0.14.5"
calloop-wayland-source = "0.4.1"
khronos-egl = { version = "6.0.0", features = ["static"] }
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-egl = "0.32.9"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }

[target.'cfg(target_os = "windows")'.dependencies]
khronos-egl = { version = "6.0", features = ["no-pkg-config", "static"] }
plugins-compat = { path = "../plugins-compat" }
windows-numerics = "0.1.1"
winit = "0.30.13"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.60"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Touch",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
